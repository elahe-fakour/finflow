previews:
  generation: off

projects:
  - name: FinFlow
    environments:
      - name: demo
        services:
          - type: web
            name: finflow-demo-web
            runtime: node
            region: frankfurt
            plan: free
            buildCommand: npm ci && npm run build
            startCommand: npm run start
            autoDeployTrigger: checksPass
            envVars:
              - key: API_BASE_URL
                fromService:
                  name: finflow-demo-api
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL

          - type: web
            name: finflow-demo-api
            runtime: node
            region: frankfurt
            plan: free
            buildCommand: npm ci && npm run prisma:generate && npm run build:api
            startCommand: npm run prisma:migrate:deploy && npm run start --workspace @finflow/api
            healthCheckPath: /api/v1/ready
            autoDeployTrigger: checksPass
            envVars:
              - key: DATABASE_URL
                sync: false
              - key: WEB_ORIGIN
                fromService:
                  name: finflow-demo-web
                  type: web
                  envVarKey: RENDER_EXTERNAL_URL
              - key: INVITATION_ENCRYPTION_KEY
                sync: false
              - key: INVITATION_DELIVERY_INTERVAL_MS
                value: "0"
